[project]
name = "konsiliet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
konsiliet = "konsiliet:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
